[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sa-health-anomaly-detection"
version = "0.1.0"
description = "Streamlit anomaly detection for South African health facility Routine data"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "openpyxl>=3.1,<4",
  "streamlit>=1.38,<2",
  "plotly>=5.24,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
